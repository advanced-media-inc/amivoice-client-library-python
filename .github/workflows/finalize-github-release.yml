name: Finalize GitHub Release

on:
  workflow_call:
    inputs:
      version:
        description: "Formal X.Y.Z release version"
        required: true
        type: string
      source_commit:
        description: "Source commit used to build the published artifacts"
        required: true
        type: string
      artifact_name:
        description: "GitHub Actions artifact containing the published files"
        required: true
        type: string

permissions: {}

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.28"
  DISTRIBUTION_NAME: "amivoice-api-client"

jobs:
  finalize:
    name: Verify PyPI and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}
    permissions:
      contents: write # The job creates the formal release tag and GitHub Release
      actions: read # The job downloads the immutable release artifact

    steps:
      - name: Revalidate release authorization
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release execution is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            if ! response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission"); then
              echo "Release authorization lookup failed for actor: $username" >&2
              return 1
            fi
            if ! jq -e '.permission == "admin"' <<<"$response" >/dev/null; then
              echo "Release authorization failed for actor: $username" >&2
              return 1
            fi
            return 0
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"

      - name: Validate release inputs before checkout
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "GitHub Release version is not a formal X.Y.Z version: $RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub Release source commit is not a full commit SHA" >&2
            exit 1
          fi

      - name: Check out the exact source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the immutable published artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifact

      - name: Verify the checked out source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          checked_out_commit=$(git rev-parse HEAD)
          if [[ "$checked_out_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Checked out commit does not match the published artifact source" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release validation dependencies
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: uv.lock

      - name: Install the project validation environment
        run: uv sync --locked --dev --python "$PYTHON_VERSION"

      - name: Verify PyPI files and version metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv run --locked python -m tools.release.pypi_release verify-pypi \
            --dist-dir release-artifact/dist \
            --manifest release-artifact/release-manifest.json \
            --distribution "$DISTRIBUTION_NAME" \
            --version "$RELEASE_VERSION"

      - name: Create or verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            tag_commit=$(git rev-list -n 1 "$RELEASE_VERSION")
            if [[ "$tag_commit" != "$SOURCE_COMMIT" ]]; then
              echo "Existing release tag points to a different commit" >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_VERSION" "$SOURCE_COMMIT" -m "Release $RELEASE_VERSION"
            basic_credential=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            echo "::add-mask::$basic_credential"
            git -c "http.extraheader=AUTHORIZATION: basic $basic_credential" \
              push origin "refs/tags/$RELEASE_VERSION"
          fi

      - name: Create or verify the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_error_file=$(mktemp)
          if release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_VERSION" 2>"$release_error_file"); then
            release_tag=$(jq -r '.tag_name' <<<"$release_json")
            release_is_draft=$(jq -r '.draft' <<<"$release_json")
            release_is_prerelease=$(jq -r '.prerelease' <<<"$release_json")
            if [[ "$release_tag" != "$RELEASE_VERSION" || "$release_is_draft" != "false" || "$release_is_prerelease" != "false" ]]; then
              echo "Existing GitHub Release does not match the formal release state" >&2
              exit 1
            fi
          else
            if ! grep -q "404" "$release_error_file"; then
              cat "$release_error_file" >&2
              echo "Unable to determine whether the GitHub Release already exists" >&2
              exit 1
            fi
            gh release create "$RELEASE_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "AmiVoice API Client $RELEASE_VERSION" \
              --generate-notes
          fi

      - name: Write finalization summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          {
            echo "## GitHub Release finalization"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- PyPI artifacts, tag, and GitHub Release were verified"
          } >> "$GITHUB_STEP_SUMMARY"
