name: Publish TestPyPI

on:
  workflow_dispatch:

concurrency:
  group: publish-testpypi
  cancel-in-progress: false

permissions: {}

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.11.28"
  DISTRIBUTION_NAME: "amivoice-api-client"
  TESTPYPI_REPOSITORY_URL: "https://test.pypi.org/legacy/"

jobs:
  authorize:
    name: Authorize release execution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.admin-check.outputs.authorized }}

    steps:
      - name: Verify main ref and repository administrators
        id: admin-check
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI publication is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission")
            if ! jq -e '.permission == "admin"' <<<"$response" >/dev/null; then
              echo "Release authorization failed for actor: $username" >&2
              return 1
            fi
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build TestPyPI distribution
    needs: authorize
    if: ${{ github.ref == 'refs/heads/main' && needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.resolve-version.outputs.base_version }}
      version: ${{ steps.resolve-version.outputs.version }}
      artifact_name: testpypi-distributions

    steps:
      - name: Revalidate repository administrators before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI build is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission")
            jq -e '.permission == "admin"' <<<"$response" >/dev/null
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"

      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install development dependencies
        run: uv sync --locked --dev --python "$PYTHON_VERSION"

      - name: Resolve the next TestPyPI version
        id: resolve-version
        run: uv run --locked python -m tools.release.testpypi_version --output github-output >> "$GITHUB_OUTPUT"

      - name: Run tests and static checks
        run: |
          uv run --locked pytest tests/unit
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Build the development distribution from a temporary source tree
        env:
          BASE_VERSION: ${{ steps.resolve-version.outputs.base_version }}
          DEVELOPMENT_VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist build src/*.egg-info
          build_root=$(mktemp -d "$RUNNER_TEMP/testpypi-source.XXXXXX")
          uv run --locked python -m tools.release.prepare_testpypi_source \
            --source "$GITHUB_WORKSPACE" \
            --destination "$build_root/source" \
            --base-version "$BASE_VERSION" \
            --version "$DEVELOPMENT_VERSION"
          uv run --locked python -m build \
            --sdist \
            --wheel \
            --outdir "$GITHUB_WORKSPACE/dist" \
            "$build_root/source"
          uv run --locked twine check "$GITHUB_WORKSPACE"/dist/*
          uv run --locked python tools/release/validate_package_artifacts.py \
            --dist-dir "$GITHUB_WORKSPACE/dist" \
            --distribution "$DISTRIBUTION_NAME" \
            --version "$DEVELOPMENT_VERSION"

      - name: Upload the TestPyPI distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testpypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Write build summary
        env:
          BASE_VERSION: ${{ steps.resolve-version.outputs.base_version }}
          DEVELOPMENT_VERSION: ${{ steps.resolve-version.outputs.version }}
        run: |
          {
            echo "## TestPyPI build"
            echo
            echo "- Base version: \\`$BASE_VERSION\\`"
            echo "- Development version: \\`$DEVELOPMENT_VERSION\\`"
            echo
            echo '```text'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to TestPyPI
    needs: [authorize, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.authorize.outputs.authorized == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/amivoice-api-client
    permissions:
      contents: read
      actions: read # Artifact download requires read access
      id-token: write # Trusted Publishing requires an OIDC token

    steps:
      - name: Revalidate repository administrators before publication
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI publication is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission")
            jq -e '.permission == "admin"' <<<"$response" >/dev/null
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"

      - name: Download the built distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: testpypi-distributions
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: ${{ env.TESTPYPI_REPOSITORY_URL }}
          packages-dir: dist
          skip-existing: false

      - name: Write publication summary
        env:
          DEVELOPMENT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## TestPyPI publication"
            echo
            echo "Published \\`$DISTRIBUTION_NAME==$DEVELOPMENT_VERSION\\`"
            echo
            echo '```text'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test TestPyPI package
    needs: [authorize, build, publish]
    if: ${{ github.ref == 'refs/heads/main' && needs.authorize.outputs.authorized == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Revalidate repository administrators before smoke test checkout
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI smoke test is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission")
            jq -e '.permission == "admin"' <<<"$response" >/dev/null
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"

      - name: Check out the repository for the smoke test
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the exact TestPyPI version in a clean environment
        env:
          DEVELOPMENT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          environment_dir=$(mktemp -d "$RUNNER_TEMP/testpypi-smoke.XXXXXX")
          python -m venv "$environment_dir"
          "$environment_dir/bin/python" -m pip install \
            --disable-pip-version-check \
            --index-url https://test.pypi.org/simple/ \
            --no-deps \
            "$DISTRIBUTION_NAME==$DEVELOPMENT_VERSION"
          (
            cd "$RUNNER_TEMP"
            "$environment_dir/bin/python" "$GITHUB_WORKSPACE/tools/release/package_smoke_test.py" \
              --distribution "$DISTRIBUTION_NAME" \
              --version "$DEVELOPMENT_VERSION"
          )
          "$environment_dir/bin/python" -m pip check

      - name: Write smoke test summary
        env:
          DEVELOPMENT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## TestPyPI smoke test"
            echo
            echo "Verified \\`$DISTRIBUTION_NAME==$DEVELOPMENT_VERSION\\`"
          } >> "$GITHUB_STEP_SUMMARY"
