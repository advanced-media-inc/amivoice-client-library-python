name: Verify Release Authorization

on:
  workflow_call:
    outputs:
      authorized:
        description: "Whether release execution is authorized"
        value: ${{ jobs.verify.outputs.authorized }}

permissions: {}

jobs:
  verify:
    name: Verify main ref and repository administrators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.admin-check.outputs.authorized }}

    steps:
      - name: Verify main ref and repository administrators
        id: admin-check
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release authorization is allowed only from main: $GITHUB_REF" >&2
            exit 1
          fi

          check_repository_administrator() {
            local username="$1"
            local encoded_username
            local response

            encoded_username=$(jq -rn --arg username "$username" '$username | @uri')
            if ! response=$(curl --silent --show-error --fail-with-body \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/collaborators/$encoded_username/permission"); then
              echo "Release authorization lookup failed for actor: $username" >&2
              return 1
            fi
            if ! jq -e '.permission == "admin"' <<<"$response" >/dev/null; then
              echo "Release authorization failed for actor: $username" >&2
              return 1
            fi
            return 0
          }

          check_repository_administrator "$INITIAL_ACTOR"
          check_repository_administrator "$TRIGGERING_ACTOR"
          echo "authorized=true" >> "$GITHUB_OUTPUT"
